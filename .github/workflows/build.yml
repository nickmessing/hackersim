name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  bundle:
    name: Linux bundles (deb, rpm, AppImage)
    needs: check
    # Build on the oldest supported Ubuntu so the AppImage runs on as many distros as possible.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf file

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Build bundles
        run: npm run app:build

      - name: Collect artifacts
        id: collect
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then LABEL="${GITHUB_REF_NAME#v}"; else LABEL="${VERSION}-$(git rev-parse --short HEAD)"; fi
          mkdir -p out
          B=src-tauri/target/release/bundle
          cp "$B"/deb/*.deb        "out/hackersim_${LABEL}_amd64.deb"
          cp "$B"/rpm/*.rpm        "out/hackersim-${LABEL}.x86_64.rpm"
          cp "$B"/appimage/*.AppImage "out/HackerSim_${LABEL}_x86_64.AppImage"
          (cd out && sha256sum * > SHA256SUMS.txt)
          ls -la out
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: hackersim-linux-${{ steps.collect.outputs.label }}
          path: out/*
          if-no-files-found: error

  bundle-windows:
    name: Windows bundles (NSIS installer, MSI, portable exe)
    needs: check
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Build bundles
        run: npx tauri build --bundles nsis,msi

      - name: Collect artifacts
        id: collect
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then LABEL="${GITHUB_REF_NAME#v}"; else LABEL="${VERSION}-$(git rev-parse --short HEAD)"; fi
          mkdir -p out
          R=src-tauri/target/release
          cp "$R"/bundle/nsis/*.exe "out/HackerSim_${LABEL}_x64-setup.exe"
          cp "$R"/bundle/msi/*.msi  "out/HackerSim_${LABEL}_x64.msi"
          cp "$R"/hackersim.exe     "out/HackerSim_${LABEL}_x64-portable.exe"
          (cd out && sha256sum * > SHA256SUMS-windows.txt)
          ls -la out
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: hackersim-windows-${{ steps.collect.outputs.label }}
          path: out/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [bundle, bundle-windows]
    if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --title "HackerSim 2001 ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag

      - name: Nightly pre-release (latest main)
        if: github.ref == 'refs/heads/main'
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly out/* \
            --title "Nightly build ($(git rev-parse --short HEAD))" \
            --notes "Automatic build of the latest \`main\` ($(git rev-parse --short HEAD)). Linux: .deb, .rpm or .AppImage. Windows: the -setup.exe installer, the .msi, or the portable .exe (needs the Microsoft Edge WebView2 runtime, which Windows 10/11 already include). For stable versions see the tagged releases." \
            --prerelease \
            --target "$GITHUB_SHA"
